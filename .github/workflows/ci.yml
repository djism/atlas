name: C++ build and tests
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays: also on macOS
  workflow_dispatch: # Actions tab > Run workflow: also on macOS
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        # Linux on every push. macOS weekly and on demand: hosted macOS runners
        # are scarce, and a push on 2026-11-24 failed only because no macOS runner
        # was assigned within 15 minutes (the code itself passed). Development
        # happens on a Mac, where every change is built and tested locally.
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run demo
        run: ./build/atlas_demo
  # The distributed evaluation system (eval/): unit tests with a fake clock,
  # HTTP tests, and a crash/recovery run with real processes (test jobs; CI
  # has no KITTI data). Linux only: macOS runners are scarce and these tests
  # use nothing platform-specific beyond POSIX signals.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluation system tests (Python standard library only)
        run: python -m unittest discover -s eval/tests -v
